name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight test dependency
        run: python -m pip install --upgrade pip numpy

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tokenizer self-test
        run: python test_tokenizer.py

      - name: Validate Colab notebook JSON
        run: python -c "import json; json.load(open('notebooks/Market_Foundation_Model_T4.ipynb', encoding='utf-8'))"

      - name: Check dependency consistency
        run: python -m pip check
