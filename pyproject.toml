[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-foundation-model"
version = "0.1.0"
description = "GPT-style foundation model research for multi-asset market time series"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - no license granted" }
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.7,<4",
    "torch>=2.1,<3",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["ckpt", "results", "corpus", "npz", "mkt", "parts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
